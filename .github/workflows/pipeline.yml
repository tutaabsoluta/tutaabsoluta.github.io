# Test → build → deploy. Nothing reaches GitHub Pages unless every test passes.
#
# Visual snapshots: on pull requests a visual change fails the run (review
# it). On pushes to main it is treated as intended: the Linux baselines are
# rewritten, committed back, and the deploy goes ahead. The diff images are
# kept in the "playwright-report" artifact.
name: Test & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Check, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # to commit updated visual baselines on main
    env:
      ON_MAIN: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Playwright tests
        run: npx playwright test
        env:
          UPDATE_VISUALS: ${{ env.ON_MAIN == 'true' && '1' || '' }}

      # Commits by the workflow token don't trigger new runs, so no loop.
      - name: Commit updated visual baselines
        if: env.ON_MAIN == 'true'
        run: |
          git add tests/__screenshots__
          if git diff --cached --quiet; then
            echo "Visual baselines unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -m "test: update visual baselines"
            git pull --rebase
            git push
          fi

      # Publishes this run's results with the site (dist/ci-report.json).
      - name: Save test results into the site
        run: node scripts/ci-report.mjs

      # Share-preview image, rendered from the current content: no image in the repo.
      - name: Generate share image
        run: node scripts/og-image.mjs

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Upload site
        if: env.ON_MAIN == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
