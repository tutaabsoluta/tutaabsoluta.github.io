# Run by hand after an intended visual change (Actions → "Update visual
# baselines" → Run workflow). Regenerates the Linux screenshots the pipeline
# compares against and commits them. Then re-run "Test & deploy": commits
# pushed with the workflow token don't trigger other workflows.
name: Update visual baselines

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build

      - name: Regenerate screenshots
        run: npx playwright test visual.spec.ts --update-snapshots

      - name: Commit new baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add tests/__screenshots__
          if git diff --cached --quiet; then
            echo "Baselines unchanged."
          else
            git commit -m "test: update visual baselines"
            git push
          fi
